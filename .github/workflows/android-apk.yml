name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated ephemeral standard Android debug keystore"
            fi
          fi

      - name: Restore and verify app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set +x
          mkdir -p app

          if [ -f app/google-services.json ]; then
            echo "Using existing app/google-services.json from repository"
          elif [ -f google-services.json ]; then
            cp google-services.json app/google-services.json
            echo "Copied google-services.json from repository root to app/google-services.json"
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '^[[:space:]]*{'; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n' | base64 --decode > app/google-services.json
            fi
            chmod 600 app/google-services.json
            echo "Created app/google-services.json from GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 --decode > app/google-services.json
            chmod 600 app/google-services.json
            echo "Created app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          else
            echo "::error::app/google-services.json not found and GOOGLE_SERVICES_JSON secret is not configured. In GitHub go to Settings -> Secrets and variables -> Actions -> New repository secret, create GOOGLE_SERVICES_JSON, and paste your downloaded google-services.json content."
            exit 1
          fi

          if ! python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
            echo "::error::app/google-services.json is not valid JSON. Re-check the GOOGLE_SERVICES_JSON secret value."
            exit 1
          fi

          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.gosalasamiti.jbgsxk"' app/google-services.json; then
            echo "::error::app/google-services.json does not match applicationId com.aistudio.gosalasamiti.jbgsxk"
            exit 1
          fi

          if ! grep -q '"client_type"[[:space:]]*:[[:space:]]*3' app/google-services.json; then
            echo "::error::app/google-services.json is missing OAuth client_type 3 (Web Client ID) required to generate R.string.default_web_client_id."
            exit 1
          fi

          echo "Verified app/google-services.json structure (package_name and OAuth client_type 3 present)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Verify Google Services default_web_client_id generation
        run: |
          gradle :app:processDebugGoogleServices --no-daemon
          grep -q 'name="default_web_client_id"' app/build/generated/res/processDebugGoogleServices/values/values.xml

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jay-Bhole-Goshala-APK
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

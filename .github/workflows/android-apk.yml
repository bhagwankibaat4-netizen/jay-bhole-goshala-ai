name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '\r\n' < debug.keystore.base64 | base64 --decode > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated ephemeral standard Android debug keystore"
            fi
          fi

      - name: Restore and verify app/google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret"
          elif [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n' | base64 --decode > app/google-services.json
            echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::Missing app/google-services.json! Add GitHub Secret GOOGLE_SERVICES_JSON (paste raw app/google-services.json) or GOOGLE_SERVICES_JSON_BASE64, or commit app/google-services.json for com.aistudio.gosalasamiti.jbgsxk."
            exit 1
          fi

          if ! grep -q '"package_name"[[:space:]]*:[[:space:]]*"com.aistudio.gosalasamiti.jbgsxk"' app/google-services.json; then
            echo "::error::app/google-services.json does not match applicationId com.aistudio.gosalasamiti.jbgsxk"
            exit 1
          fi

          if ! grep -q '"client_type"[[:space:]]*:[[:space:]]*3' app/google-services.json; then
            echo "::error::app/google-services.json is missing OAuth client_type 3 (Web Client ID) needed to generate R.string.default_web_client_id."
            exit 1
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Verify Google Services default_web_client_id generation
        run: |
          gradle :app:processDebugGoogleServices --no-daemon
          grep -q 'name="default_web_client_id"' app/build/generated/res/processDebugGoogleServices/values/values.xml

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jay-Bhole-Goshala-APK
          path: 'app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
